# agent.yaml
# watsonx Orchestrate ADK agent definition
# Deploy with: wxo agents deploy --file agent.yaml
#
# Docs: https://developer.watson-orchestrate.ibm.com/docs/adk

spec_version: "0.1"

agents:
  - name: triage-escalation-agent
    description: >
      Analyzes emergency department triage notes and patient vitals to identify
      patients at risk of clinical deterioration. Returns a structured escalation
      recommendation including risk signals, CTAS acuity estimate, and clinical
      reasoning. Use this agent when a nurse submits a triage note for review.
    model: ibm/granite-3-8b-instruct
    instructions: |
      You are a clinical decision support agent for emergency departments in
      Newfoundland and Labrador. When a user provides a triage note and vitals,
      invoke the analyze_triage_note tool and return the full structured result
      clearly formatted. Always include the reasoning field so the nurse
      understands why a flag was raised or not raised. Never make a final
      clinical decision — you are a decision support tool only.
    tools:
      - name: analyze_triage_note
        type: python
        source: tools/escalation_tool.py
        function: analyze_triage_note
        description: >
          Calls watsonx.ai Granite to analyze a triage note and vitals.
          Returns escalation_flag (YES/NO), acuity_estimate (CTAS 1-5),
          risk_signals, recommended_action, and reasoning.
        parameters:
          - name: note
            type: string
            description: Free-text triage note written by the nurse
            required: true
          - name: hr
            type: integer
            description: Heart rate in bpm
            required: true
          - name: sbp
            type: integer
            description: Systolic blood pressure in mmHg
            required: true
          - name: dbp
            type: integer
            description: Diastolic blood pressure in mmHg
            required: true
          - name: rr
            type: integer
            description: Respiratory rate in breaths per minute
            required: true
          - name: o2
            type: number
            description: O2 saturation as a percentage e.g. 96.0
            required: true
          - name: temp
            type: number
            description: Temperature in Celsius
            required: true
          - name: gcs
            type: string
            description: Glasgow Coma Scale string e.g. E4V5M6 (optional)
            required: false
