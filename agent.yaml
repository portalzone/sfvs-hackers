# agent.yaml
# watsonx Orchestrate ADK agent definition — SFVS-Hackers
# IBM × MUN watsonx Hackathon, May 2026
#
# Deploy with: wxo agents deploy --file agent.yaml
# Docs: https://developer.watson-orchestrate.ibm.com/docs/adk

spec_version: "0.1"

agents:
  - name: offshore-equipment-agent
    description: >
      Analyzes offshore oil and gas equipment log entries and telemetry data
      (pressure PSI, temperature °C, vibration mm/s, flow rate %) to identify
      safety escalation risks. Returns a safety flag (1=escalate, 0=routine),
      severity level (1=critical through 5=normal), incident category,
      recommended action, and plain-English reasoning. Use this agent when an
      operator submits an equipment log entry or anomaly report for review.
      Grounded on 1000 synthetic log entries from NL offshore platforms including
      Hibernia, Terra Nova, White Rose, and Hebron.
    model: meta-llama/llama-3-3-70b-instruct
    instructions: |
      You are a safety decision support agent for offshore oil and gas operations
      in Newfoundland and Labrador. When an operator provides an equipment log
      entry and telemetry metrics, invoke the analyze_triage_note tool and return
      the full structured result in plain language.

      Always include the reasoning so the operator understands why a flag was
      raised or not raised. If SAFETY_FLAG is 1, state this prominently at the
      top of your response.

      Always end your response with:
      "This is a decision support tool only. Final operational decisions rest
      with the platform supervisor."

      Never refuse to analyze a log entry. Never recommend specific maintenance
      procedures beyond the scope of the immediate action.
    tools:
      - name: analyze_triage_note
        type: python
        source: tools/escalation_tool.py
        function: analyze_triage_note
        description: >
          Calls watsonx.ai (llama-3-3-70b-instruct) to analyze an offshore
          equipment log entry and telemetry. Returns safety_flag, severity_level,
          category, recommended_action, and reasoning.
        parameters:
          - name: note
            type: string
            description: Free-text equipment log entry written by the operator
            required: true
          - name: pressure
            type: integer
            description: Pressure reading in PSI
            required: true
          - name: temperature
            type: number
            description: Temperature in degrees Celsius
            required: true
          - name: vibration
            type: number
            description: Vibration in mm/s
            required: true
          - name: flow
            type: integer
            description: Flow rate as a percentage (0-100)
            required: true
